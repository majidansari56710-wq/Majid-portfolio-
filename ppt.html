<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generations of Computer - PPT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ppt-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            max-width: 900px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .ppt-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-top: 20px;">Generations of Computers</h2>

    <!-- PPT Embed Frame -->
    <div class="ppt-container">
<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=https://docs.google.com/uc?export=download&id=1-d3_TpZbsnFEoTFa3v7q5C28FyxOWlmG" width="100%" height="100%" frameborder="0"></iframe>


    </div>

    <script src="script.js"></script>
</body>
</html>
